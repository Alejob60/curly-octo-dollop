# Cloud Build configuration for Orbital Prime
# Builds Docker image and deploys to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - '.'
    env:
      - 'CLOUDSDK_BUILD_REGION=us-central1'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '3001'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '100'
      - '--min-instances'
      - '1'
      - '--set-env-vars'
      - 'MONGODB_PROVIDER=atlas,AI_PROVIDER=vertex,LOG_LEVEL=info'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'

# Configure build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Substitutions for flexible configuration
substitutions:
  _SERVICE_NAME: 'orbital-prime-api'
  _REGION: 'us-central1'
  _SERVICE_ACCOUNT: 'orbital-prime-sa@$PROJECT_ID.iam.gserviceaccount.com'

# Images to push
images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'

# Build timeout in seconds
timeout: '3600s'

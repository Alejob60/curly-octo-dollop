version: '3.8'

services:
  orfeo-bridge:
    image: python:3.12-slim
    container_name: orfeo-bridge-mock
    command: python -m http.server 8080
    expose:
      - "8080"
    networks:
      - internal_govtech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

  saul-bridge:
    image: python:3.12-slim
    container_name: saul-bridge-mock
    command: python -m http.server 8081
    expose:
      - "8081"
    networks:
      - internal_govtech

  sap-bridge:
    image: python:3.12-slim
    container_name: sap-bridge-mock
    command: python -m http.server 8082
    expose:
      - "8082"
    networks:
      - internal_govtech

networks:
  internal_govtech:
    external: true
